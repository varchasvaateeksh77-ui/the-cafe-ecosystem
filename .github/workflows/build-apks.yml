name: Build Android APKs & Publish Live OTA Bundle (Waiter, Kitchen, Owner Admin)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Root Dependencies & Capacitor Android Plugins
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/local-notifications@^6.0.0 @capacitor/haptics@^6.0.0

      - name: Build Universal OTA Cloud Bundle (ota/bundle.js, ota/bundle.css, ota/manifest.json)
        run: |
          mkdir -p ota apks
          npm run build
          JS_FILE=$(ls dist/assets/index-*.js | head -n 1)
          CSS_FILE=$(ls dist/assets/index-*.css | head -n 1)
          cp "$JS_FILE" ota/bundle.js
          cp "$CSS_FILE" ota/bundle.css
          OTA_VER=$(date +%s)
          echo "OTA_VER=$OTA_VER" >> $GITHUB_ENV
          cat > ota/manifest.json << EOF
          {
            "otaVersion": ${OTA_VER},
            "releaseChannel": "production-live",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "notes": "Automated Over-The-Air (OTA) Live Bundle Push"
          }
          EOF

      - name: Build 1 - Waiter Phone APK (com.buildbros.waiter) with Live OTA Loader
        run: |
          VITE_DEFAULT_APK=waiter VITE_OTA_VERSION=${{ env.OTA_VER }} npm run build
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.buildbros.waiter",
            "appName": "Build Bros Waiter",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon_config_sample",
                "iconColor": "#E8500C"
              }
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/buildbros-waiter.apk

      - name: Build 2 - Kitchen & Reception KDS APK (com.buildbros.kitchen) with Live OTA Loader
        run: |
          VITE_DEFAULT_APK=kitchen VITE_OTA_VERSION=${{ env.OTA_VER }} npm run build
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.buildbros.kitchen",
            "appName": "Build Bros Kitchen KDS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon_config_sample",
                "iconColor": "#E8500C"
              }
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/buildbros-kitchen.apk

      - name: Build 3 - Owner Admin Phone APK (com.buildbros.admin) with Live OTA Loader
        run: |
          VITE_DEFAULT_APK=admin VITE_OTA_VERSION=${{ env.OTA_VER }} npm run build
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.buildbros.admin",
            "appName": "Build Bros Owner Admin",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon_config_sample",
                "iconColor": "#E8500C"
              }
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/buildbros-admin.apk
          rm -rf android capacitor.config.json

      - name: Commit Compiled .apk Files and Live OTA Bundles Directly into Repo
        run: |
          git config user.name "varchasvaateeksh77-ui"
          git config user.email "varchasvaateeksh77@gmail.com"
          git add -f apks/buildbros-waiter.apk apks/buildbros-kitchen.apk apks/buildbros-admin.apk ota/bundle.js ota/bundle.css ota/manifest.json
          git commit -m "chore(ota+apk): publish live OTA bundle & compiled Android .apk files [skip ci]" || true
          git push origin HEAD:main || true

      - name: Upload 3 Android APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buildbros-cafe-ecosystem-apks
          path: |
            apks/buildbros-waiter.apk
            apks/buildbros-kitchen.apk
            apks/buildbros-admin.apk

      - name: Publish Direct Download APKs to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 \
            apks/buildbros-waiter.apk \
            apks/buildbros-kitchen.apk \
            apks/buildbros-admin.apk \
            --title "The Cafe Ecosystem — OTA-Enabled Android Phone APKs (v2.4)" \
            --notes "Direct installable Android APKs with Over-The-Air (OTA) live hot-updates, cross-phone Supabase Realtime + Cloud Sync, and native Android status-bar notifications:
            - **Waiter Phone APK** (\`buildbros-waiter.apk\` · \`com.buildbros.waiter\`)
            - **Kitchen & Reception KDS APK** (\`buildbros-kitchen.apk\` · \`com.buildbros.kitchen\`)
            - **Owner / Admin Phone APK** (\`buildbros-admin.apk\` · \`com.buildbros.admin\`)" \
            --latest
